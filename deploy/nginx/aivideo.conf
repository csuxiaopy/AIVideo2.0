# Installed at /www/server/panel/vhost/nginx/aivideo.conf.
# The upstream currently allows localhost origins only. Validate the public
# browser origin here before translating it to an origin trusted by the app.
map $http_origin $aivideo_ws_origin_allowed {
    default 0;
    "http://172.16.166.229" 1;
    "http://172.16.166.229:80" 1;
    "http://127.0.0.1" 1;
    "http://localhost" 1;
}
map $http_upgrade $aivideo_connection_upgrade {
    default upgrade;
    '' close;
}
log_format aivideo_timing '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent rt=$request_time upstream=$upstream_response_time';

server {
    listen 80;
    server_name 172.16.166.229;
    root /www/wwwroot/aivideo/current;
    index index.html;
    sendfile on;
    etag on;
    client_max_body_size 50m;
    access_log /www/wwwlogs/aivideo-access.log aivideo_timing;
    error_log /www/wwwlogs/aivideo-error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
        application/xml image/svg+xml;

    # Override the host's inherited proxy cache. Authenticated API responses
    # and evidence must never enter a shared cache.
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
    }
    location /evidence/ {
        proxy_pass http://127.0.0.1:8100;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8100;
    }
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8100;
    }
    location /ws/ {
        if ($aivideo_ws_origin_allowed = 0) { return 403; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "http://localhost:5173";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aivideo_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8100;
    }

    # Vite-generated filenames contain content hashes. Never cache a missing
    # asset or return the SPA HTML for an absent JavaScript file.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /brand-icon.png {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
