# Apply over the production baseline:
# docker compose -f compose.cpu.yml -f compose.gpu.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: 0,1
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      YOLO_DEVICE: "0"
      FIRE_SMOKE_DEVICE: "1"
      YOLO_INFERENCE_PROCESSES: ${YOLO_INFERENCE_PROCESSES:-1}
      YOLO_BATCH_SIZE: ${YOLO_BATCH_SIZE:-8}
      YOLO_THREADS_PER_PROCESS: ${YOLO_THREADS_PER_PROCESS:-1}
      FIRE_SMOKE_WORKERS: ${FIRE_SMOKE_WORKERS:-1}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-20}
      CAPTURE_FPS: ${CAPTURE_FPS:-1}
      CAPTURE_MAX_HEIGHT: ${CAPTURE_MAX_HEIGHT:-960}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
