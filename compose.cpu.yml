# 生产基线配置（Linux 服务器）
# 日常开发/持续更新请叠加 compose.cpu.dev.yml：
#   docker compose -f compose.cpu.yml -f compose.cpu.dev.yml up -d
#
# 设计要点：
# - 数据库使用 SQLite（服务器现有 data/yolo_vlm.db 直接挂载，零迁移、数据不丢）
# - 持久化数据（SQLite/evidence/snapshots）全部落在宿主 ./data 目录
# - 依赖装入镜像；业务代码更新不重建镜像（dev 覆盖层通过 bind mount 挂载）
services:
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:8-alpine}
    pull_policy: missing
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8100
      DATABASE_URL: sqlite:////app/data/yolo_vlm.db
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-this-before-production}
      YOLO_MODEL: ${YOLO_MODEL:-yolo26n.pt}
      YOLO_DEVICE: cpu
      FIRE_SMOKE_MODEL: ${FIRE_SMOKE_MODEL:-models/fire_smoke_yolov8.pt}
      FIRE_SMOKE_SHA256: ${FIRE_SMOKE_SHA256:-ac0a10257b2bc1f20c9d957f8adeeb61dd6140322fc19d0b4a116cb491776d16}
      FIRE_SMOKE_DEVICE: cpu
      FIRE_SMOKE_WORKERS: ${FIRE_SMOKE_WORKERS:-1}
      SHADOW_MODE: ${SHADOW_MODE:-true}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-2}
      MAX_LIVE_PREVIEWS: ${MAX_LIVE_PREVIEWS:-4}
      LIVE_PREVIEW_FPS: ${LIVE_PREVIEW_FPS:-2}
      LIVE_PREVIEW_TIMEOUT_SECONDS: ${LIVE_PREVIEW_TIMEOUT_SECONDS:-60}
      FRAME_CAPTURE_TIMEOUT_SECONDS: ${FRAME_CAPTURE_TIMEOUT_SECONDS:-15}
    ports:
      - "8100:8100"
    volumes:
      # 持久化：SQLite 库 + evidence + snapshots 全部在宿主 ./data，重启/更新不丢
      - ./data:/app/data
      - model_cache:/root/.cache
      - ./models:/app/models:ro
      - ./yolo26n.pt:/app/yolo26n.pt:ro
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/library/prometheus:v3.4.1}
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]

  grafana:
    image: ${GRAFANA_IMAGE:-docker.m.daocloud.io/library/grafana:12.0.2}
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-monitor-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  redis_data:
  model_cache:
  grafana_data:
