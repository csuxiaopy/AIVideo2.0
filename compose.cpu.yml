# 生产基线配置（Linux 服务器）
# 日常开发/持续更新请叠加 compose.cpu.dev.yml：
#   docker compose -f compose.cpu.yml -f compose.cpu.dev.yml up -d
#
# 设计要点：
# - 数据库使用 PostgreSQL 17 容器，数据落 postgres_data 卷，跨重建不丢
# - evidence/snapshots 落独立卷（evidence_data / snapshot_data）
# - 依赖装入镜像；业务代码更新不重建镜像（dev 覆盖层通过 bind mount 挂载）
# - 镜像默认走 daocloud 国内源，可用 ${XXX_IMAGE} 环境变量覆盖
services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17-alpine}
    pull_policy: missing
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:8-alpine}
    pull_policy: missing
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    # 旧 Docker（如 19.03）默认 seccomp 与 Debian 13 线程创建不兼容，运行时需放开；
    # 新环境（Docker 20.10+ / containerd）可删除本段
    security_opt:
      - seccomp=unconfined
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8100
      DATABASE_URL: postgresql+psycopg://monitor:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/monitor
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change-this-before-production}
      YOLO_MODEL: ${YOLO_MODEL:-yolo26n.pt}
      YOLO_DEVICE: cpu
      FIRE_SMOKE_MODEL: ${FIRE_SMOKE_MODEL:-models/fire_smoke_yolov8.pt}
      FIRE_SMOKE_SHA256: ${FIRE_SMOKE_SHA256:-ac0a10257b2bc1f20c9d957f8adeeb61dd6140322fc19d0b4a116cb491776d16}
      FIRE_SMOKE_DEVICE: cpu
      FIRE_SMOKE_WORKERS: ${FIRE_SMOKE_WORKERS:-1}
      SHADOW_MODE: ${SHADOW_MODE:-true}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-2}
      MAX_LIVE_PREVIEWS: ${MAX_LIVE_PREVIEWS:-4}
      LIVE_PREVIEW_FPS: ${LIVE_PREVIEW_FPS:-2}
      LIVE_PREVIEW_TIMEOUT_SECONDS: ${LIVE_PREVIEW_TIMEOUT_SECONDS:-60}
      FRAME_CAPTURE_TIMEOUT_SECONDS: ${FRAME_CAPTURE_TIMEOUT_SECONDS:-15}
    ports:
      - "8100:8100"
    volumes:
      - evidence_data:/app/data/evidence
      - snapshot_data:/app/data/snapshots
      - model_cache:/root/.cache
      - ./models:/app/models:ro
      - ./yolo26n.pt:/app/yolo26n.pt:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.m.daocloud.io/library/prometheus:v3.4.1}
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]

  grafana:
    image: ${GRAFANA_IMAGE:-docker.m.daocloud.io/library/grafana:12.0.2}
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-monitor-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres_data:
  redis_data:
  evidence_data:
  snapshot_data:
  model_cache:
  grafana_data:
